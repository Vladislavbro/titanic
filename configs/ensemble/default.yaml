# @package _global_
# Настройки ансамбля: какие модели смешиваем и какими способами

defaults:
  - /config
  - _self_

ensemble:
  models: [catboost, lightgbm, xgboost, rf, mlp, logreg, knn]
  threshold: 0.5            # порог перевода вероятности в класс
  variants: [mean, vote, stack_logreg, stack_ridge]
  metas:
    stack_logreg:
      _target_: sklearn.linear_model.LogisticRegression
      C: 0.1
      max_iter: 1000
    stack_ridge:
      _target_: sklearn.linear_model.RidgeClassifier
      alpha: 1.0
