_target_: titanic.models.MLPClassifier
hidden_sizes: [128]       # размеры скрытых слоев: 64 / 128 / 256
lr: 1e-3                  # 1e-2 / 1e-3 / 1e-4
weight_decay: 1e-2        # 0 / 1e-4 / 1e-2
batch_size: 64            # 16 / 32 / 64 / 128
epochs: 10                # 20 / 50 / 100 / 200
random_state: 42

activation: relu           # relu / gelu / tanh / leaky_relu
dropout: 0.0               # 0.0 / 0.3 / 0.5
batchnorm: false           # true — BatchNorm1d после скрытого слоя
optimizer: adamw           # adamw / adam / sgd
scheduler: none            # none / cosine
device: mps                 # mps / cuda / cpu
