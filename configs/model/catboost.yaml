_target_: catboost.CatBoostClassifier
iterations: 200                 # 150 / 300 / 500 / 1000: сколько деревьев
learning_rate: 0.03             # 0.01 / 0.03 / 0.05 / 0.1
depth: 3                        # 2 / 3 / 4 / 6: глубина деревьев
l2_leaf_reg: 5                  # 1 / 3 / 10: сила регуляризации
random_strength: 5              # 1 / 3 / 5: шум при выборе сплита
rsm: 0.8                        # % признаков на сплит
bagging_temperature: 1          # 0 / 1: 0 — без бэггинга
border_count: 128               # 64 / 128 / 254: скорость / качество
grow_policy: SymmetricTree      # SymmetricTree / Depthwise: форма деревьев
auto_class_weights: None        # None / Balanced: учёт дисбаланса классов
loss_function: Logloss          # Logloss: функция потерь
eval_metric: Accuracy           # accuracy: метрика на валидации
random_seed: 42                 # сид для воспроизводимости
verbose: 100                    # 100: печать каждые 100 итераций
