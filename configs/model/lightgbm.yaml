_target_: lightgbm.LGBMClassifier
n_estimators: 300               # 300 / 500 / 1000: сколько деревьев
learning_rate: 0.05             # 0.03 / 0.05 / 0.1
num_leaves: 31                  # 15 / 31 / 63: главный параметр сложности
max_depth: -1                   # -1 / 3 / 5: -1 — без ограничения
min_child_samples: 20           # 10 / 20 / 50: минимум объектов в листе
reg_alpha: 0                    # 0 / 0.1 / 1: L1
reg_lambda: 1                   # 0 / 1 / 10: L2
colsample_bytree: 0.8           # 0.6 / 0.8 / 1.0: доля признаков на дерево
random_state: 42                # сид для воспроизводимости
n_jobs: -1                      # все ядра
verbose: -1                     # -1: без логов
