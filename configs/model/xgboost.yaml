_target_: xgboost.XGBClassifier
n_estimators: 300               # 300 / 500 / 1000: сколько деревьев
learning_rate: 0.05             # 0.03 / 0.05 / 0.1
max_depth: 4                    # 3 / 4 / 6: глубина деревьев
min_child_weight: 1             # 1 / 3 / 5: минимум веса в листе
subsample: 0.8                  # 0.6 / 0.8 / 1.0: доля объектов на дерево
colsample_bytree: 0.8           # 0.6 / 0.8 / 1.0: доля признаков на дерево
reg_alpha: 0                    # 0 / 0.1 / 1: L1
reg_lambda: 1                   # 1 / 3 / 10: L2
gamma: 0                        # 0 / 0.1 / 1: порог для нового сплита
tree_method: hist               # hist: быстрый алгоритм
eval_metric: logloss            # logloss: метрика обучения
random_state: 42                # сид для воспроизводимости
n_jobs: -1                      # все ядра
