# Общие настройки эксперимента

defaults:
  - model: logreg
  - _self_

experiment:
  seed: 42
  wandb:
    project: titanic
    group: validation
    mode: ${oc.env:WANDB_MODE,offline}  # offline — без аккаунта wandb, online — синхронизация
    name: ${hydra:runtime.choices.model}_${hydra:job.override_dirname}  # имя рана: имя и параметры модели


# Данные и признаки
data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  submission_path: submissions
  target_col: Survived
  id_col: PassengerId

  num_features:
    - Age
    - SibSp
    - Parch
    - Fare                    # или LogFare (log1p от Fare)
    - FamilySize
    - IsAlone

  cat_features:
    - Sex
    - Embarked
    - Title
    - Pclass

# Препроцессинг
preprocessing:
  num:
    impute: median            # mean / median
    add_flag: false           # флаг "значение было пропущено"
    scale: true               # standard scaler
  cat:
    impute: most_frequent     # most_frequent / missing
    encoding: onehot          # onehot / target / ordinal
    random_state: ${experiment.seed}

# Валидация
validation:
  metric: accuracy
  cv:
    _target_: sklearn.model_selection.StratifiedKFold  # для 80 /20 StratifiedShuffleSplit
    n_splits: 5
    shuffle: true
    random_state: ${experiment.seed}

# 
hydra:
  job:
    config:
      override_dirname:
        exclude_keys: [model]