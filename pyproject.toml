[project]
name = "titanic"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "hydra-core>=1.3.0",
    "kagglehub>=1.0.3",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.4",
    "omegaconf>=2.4.0",
    "pandas>=3.1.0",
    "plotly>=7.1.0",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "wandb>=0.31.0",
]

[tool.ruff]
extend = "~/.config/ruff/pyproject.toml" # Берём глобальные настройки и дополняем их ниже.

[tool.ruff.lint.per-file-ignores]
"*.ipynb" = [
    "ANN",  # В ноутбуках не требуем аннотации типов.
    "ERA",  # В ноутбуках можно оставлять закомментированный код.
    "F811", # Ячейки с импортами часто повторяются, чтобы их можно было запускать отдельно.
]
