# Общие настройки эксперимента
experiment:
  seed: 42
  wandb:
    project: titanic
    group: validation
    name: baseline_v2


# Данные и признаки
data:
  train_path: data/raw/train.csv
  test_path: data/raw/test.csv
  submission_path: submissions
  target_col: Survived
  id_col: PassengerId

  num_features:
    - Pclass
    - Age
    - SibSp
    - Parch
    - Fare
  cat_features:
    - Sex
    - Embarked
    - Title
    - FamilySize
  fare_log: false              # выбросы в Fare

# Препроцессинг
preprocessing:
  num:
    impute: median            # mean / median
    add_flag: false           # флаг "значение было пропущено"
    scale: true               # standard scaler
  cat:
    impute: most_frequent     # most_frequent / missing
    encoding: onehot          # onehot / target / ordinal
    random_state: ${experiment.seed}


# Модель
model:
  _target_: sklearn.linear_model.LogisticRegression
  max_iter: 1000


# Валидация
validation:
  metric: accuracy
  cv:
    _target_: sklearn.model_selection.StratifiedKFold
    n_splits: 5
    shuffle: true
    random_state: ${experiment.seed}
